name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Security audit
        run: cargo audit
        working-directory: contracts
        continue-on-error: true
      - name: Build
        run: cargo build --release
        working-directory: contracts
      - name: Verify reproducible WASM checksums (skips if soroban CLI unavailable)
        run: ./scripts/reproducibility/wasm-checksums.sh --verify
      - name: Test
        run: cargo test
        working-directory: contracts
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci
        working-directory: api
      - name: Lint
        run: npm run lint
        working-directory: api
      - name: Typecheck
        run: npm run typecheck
        working-directory: api
      - name: Test
        run: npm run test
        working-directory: api
      - name: Build
        run: npm run build
        working-directory: api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - name: Install
        run: npm ci
        working-directory: oracle
      - name: Lint
        run: npm run lint
        working-directory: oracle
      - name: Typecheck
        run: npm run typecheck
        working-directory: oracle
      - name: Test
        run: npm test
        working-directory: oracle

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify reproducible lockfiles and artifacts
        run: ./scripts/reproducibility/verify.sh

  deploy-testnet:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [contracts, api, frontend, oracle]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy contracts to testnet
        run: ./scripts/deploy-testnet.sh
        env:
          STELLAR_PUBLIC_KEY: ${{ secrets.STELLAR_TESTNET_PUBLIC }}
          SOROBAN_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET }}
